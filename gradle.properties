# ---------------------------------------------------------------------------
#  Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom 1.17 + MC 26.x pins exact transitive versions; skip the
# "dependency built with newer Loom" validation (same flag Architectury API uses).
loom.ignoreDependencyLoomVersionValidation=true

# ---------------------------------------------------------------------------
#  Mod metadata
# ---------------------------------------------------------------------------
mod_id=stellarodyssey
mod_name=Stellar Odyssey
mod_version=0.1.0
mod_description=Procedural space exploration inspired by No Man's Sky.
mod_authors=amaro
mod_license=MIT
maven_group=com.amaro.stellarodyssey
archives_base_name=stellarodyssey

# Loaders compiled from the common module (Architectury transforms)
enabled_platforms=fabric,neoforge

# ---------------------------------------------------------------------------
#  Minecraft 26.3 "Wilderness Bound" (unobfuscated, Java 25)
# ---------------------------------------------------------------------------
minecraft_version=26.3
java_version=25

# Architectury API (22.x = MC 26.3)
architectury_api_version=22.0.3

# Fabric  -> https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge -> https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.51-beta
